{% comment %}
  Pop-up for the BibTeX buttons (Publications, Research and Software pages).
  A button with data-bibtex shows the text of the hidden <pre class="rs-bib"> next to it.
{% endcomment %}
<div class="rs-bibmodal" data-bibmodal hidden>
  <div class="rs-bibmodal__backdrop" data-bibclose></div>
  <div class="rs-bibmodal__box" role="dialog" aria-modal="true" aria-label="BibTeX citation">
    <button type="button" class="rs-bibmodal__close" data-bibclose aria-label="Close">&times;</button>
    <pre class="rs-bibmodal__text" data-bibtext></pre>
    <button type="button" class="rs-pill rs-bibmodal__copy" data-bibcopy>Copy</button>
  </div>
</div>
<script src="{{ base_path }}/assets/js/bibtex.js"></script>
