#   version, date (shown as written), doi (without https://doi.org/)
#   record   - the Zenodo record number (the digits in zenodo.org/records/...)
#   bibtex   - the citation shown by the BibTeX button (Zenodo: Export -> BibTeX), indented under "bibtex: |"
#   preprint - link for the Preprint button (the arXiv page of the paper)
#   license  - text for the license badge; leave empty for no badge
